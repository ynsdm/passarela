<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passarela | Catálogo Exclusivo</title>
    <meta name="title" content="Passarela | Catálogo Exclusivo">
    <meta name="description" content="Explora nuestra nueva colección de moda, arma tu carrito y realiza tu pedido directo por WhatsApp. Tu nueva tienda favorita ✨">

    <!-- Open Graph / WhatsApp / Facebook / Instagram -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://passarelamcbo.com/">
    <meta property="og:title" content="Passarela | Catálogo Exclusivo ✨">
    <meta property="og:description" content="Explora nuestra colección de moda, arma tu carrito y realiza tu pedido directo por WhatsApp.">
    <meta property="og:image" content="https://passarelamcbo.com/logo.jpg">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">

    <!-- Twitter Cards -->
    <meta property="twitter:card" content="summary_large_image">
    <meta property="twitter:url" content="https://passarelamcbo.com/">
    <meta property="twitter:title" content="Passarela | Catálogo Exclusivo ✨">
    <meta property="twitter:description" content="Explora nuestra colección de moda, arma tu carrito y realiza tu pedido directo por WhatsApp.">
    <meta property="twitter:image" content="https://passarelamcbo.com/imagen-portada.jpg">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- PapaParse para leer el CSV -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- Google Fonts para tipografía elegante -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..900;1,400..900&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="https://assets.softr-files.com/applications/c32952a6-aa43-469c-9079-0a9ec3504333/assets/c6d1c0f5-f972-44c0-b9aa-70b4fd965ee9.png">
    
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f7d3dc;
        }
        .brand-title {
            font-family: 'Playfair Display', serif;
        }
        
        /* CSS PURO PARA FORZAR MÓVIL */
        @media (max-width: 768px) {
            #product-grid {
                display: grid !important;
                grid-template-columns: repeat(2, minmax(0, 1fr)) !important;
                gap: 10px !important;
            }
            #category-filters {
                display: flex !important;
                flex-wrap: nowrap !important;
                overflow-x: auto !important;
                gap: 8px !important;
                padding-bottom: 5px !important;
            }
            #category-filters::-webkit-scrollbar {
                display: none !important;
            }
        }
    </style>
</head>
<body class="text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white/60 backdrop-blur-md border-b border-rose-200/50 shadow-xs">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex justify-between items-center">
            <a href="#" class="flex items-center">
                <img src="logo.png" alt="Passarela" class="h-12 sm:h-20 w-auto object-contain">
            </a>
            <div class="flex items-center gap-4">
                <button onclick="toggleCart()" class="relative bg-slate-900 text-white px-4 py-2 sm:px-5 sm:py-2.5 rounded-full flex items-center gap-2 hover:bg-slate-800 transition shadow-sm font-medium text-xs sm:text-sm">
                    <i class="fa-solid fa-bag-shopping text-sm sm:text-base"></i>
                    <span class="hidden sm:inline">Pedido</span>
                    <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-[10px] sm:text-[11px] text-white w-5 h-5 rounded-full flex items-center justify-center font-bold ring-2 ring-white">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal / Catálogo -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-2 sm:px-6 lg:px-8 py-4 sm:py-10">

        <!-- Buscador y Filtros -->
        <div class="flex flex-col gap-3 mb-6">
            <div class="w-full relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Buscar producto..." class="w-full pl-10 pr-4 py-2 bg-white/90 backdrop-blur-sm border border-rose-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
            </div>

            <!-- Contenedor de categorías con scroll -->
            <div class="w-full overflow-x-auto">
                <div id="category-filters" class="flex gap-2">
                    <button onclick="filterCategory('ALL')" class="category-btn shrink-0 active px-3 py-1.5 rounded-full text-[11px] font-semibold uppercase tracking-wider bg-slate-900 text-white transition">Todos</button>
                </div>
            </div>
        </div>

        <!-- Grid de Productos -->
        <div id="product-grid" class="grid grid-cols-2 sm:grid-cols-2 lg:grid-cols-3 gap-2.5 sm:gap-6">
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-600">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-slate-900"></i>
                <p class="text-sm font-medium">Cargando productos...</p>
            </div>
        </div>

        <!-- Botón Ver Más -->
        <div id="load-more-container" class="text-center mt-8 hidden">
            <button onclick="loadMoreProducts()" class="bg-slate-900 text-white px-6 py-2.5 rounded-full text-xs font-semibold hover:bg-slate-800 transition shadow-md">
                Ver más productos <i class="fa-solid fa-chevron-down ml-1.5 text-xs"></i>
            </button>
        </div>
    </main>

    <footer class="bg-white/60 backdrop-blur-md border-t border-rose-200/50 py-6 px-4 text-center text-[11px] text-slate-600 mt-8">
        <p>AV 4 BELLA VISTA CON CALLE 63 DIAGONAL A MARAPLUS CC CENTRO NORTE PLANTA ALTA LUNES A SABADO DE 10:00AM - 6:00PM</p>
    </footer>

    <!-- Modal de Detalle de Producto -->
    <div id="product-modal" class="fixed inset-0 z-50 overflow-y-auto hidden flex items-center justify-center p-4">
        <div class="absolute inset-0 bg-slate-900/50 backdrop-blur-sm transition-opacity" onclick="closeProductModal()"></div>
        <div class="relative bg-white rounded-3xl max-w-lg w-full overflow-hidden shadow-2xl z-10 animate-in fade-in zoom-in duration-200">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 z-20 w-8 h-8 rounded-full bg-white/80 backdrop-blur-sm flex items-center justify-center text-slate-600 hover:text-slate-900 shadow-md transition">
                <i class="fa-solid fa-xmark text-sm"></i>
            </button>
            <div class="max-h-[70vh] sm:max-h-[60vh] overflow-hidden bg-slate-100 relative">
                <img id="modal-img" src="" alt="" class="w-full h-full object-cover">
                <span id="modal-category" class="absolute top-4 left-4 bg-white/90 backdrop-blur-sm text-slate-800 text-xs font-bold px-3 py-1 rounded-full uppercase tracking-wider shadow-xs"></span>
            </div>
            <div class="p-6 flex flex-col gap-4">
                <div>
                    <h3 id="modal-name" class="text-lg sm:text-xl font-bold text-slate-900 mb-1"></h3>
                    <p id="modal-price" class="text-xl sm:text-2xl font-extrabold text-slate-900 mb-3"></p>
                    <div class="flex items-center gap-2">
                        <span class="text-xs font-semibold text-slate-500 uppercase tracking-wider">Talla:</span>
                        <span id="modal-size" class="bg-rose-100 text-rose-800 text-xs font-bold px-3 py-1 rounded-full uppercase">Única</span>
                    </div>
                </div>
                <button id="modal-add-btn" onclick="" class="w-full bg-slate-900 text-white py-3.5 rounded-2xl text-xs sm:text-sm font-semibold tracking-wide uppercase hover:bg-slate-800 active:scale-[0.98] transition flex items-center justify-center gap-2 shadow-lg">
                    <i class="fa-solid fa-cart-plus text-base"></i> Agregar al Pedido
                </button>
            </div>
        </div>
    </div>

    <!-- Panel Lateral del Carrito -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-6">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col">
                <div class="flex items-center justify-between px-5 py-4 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bag-shopping text-slate-900"></i>
                        <h3 class="font-bold text-slate-900 text-base">Tu Carrito</h3>
                    </div>
                    <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:text-slate-600 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <div id="cart-items" class="flex-1 overflow-y-auto p-5 space-y-4 divide-y divide-slate-50"></div>

                <div class="border-t border-slate-100 p-5 bg-slate-50/50">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-slate-500 text-sm">Subtotal estimado:</span>
                        <span id="cart-total" class="text-xl font-bold text-slate-900">$0.00</span>
                    </div>
                    <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-semibold flex items-center justify-center gap-2 hover:bg-emerald-700 transition shadow-lg shadow-emerald-600/20 text-sm">
                        <i class="fa-brands fa-whatsapp text-lg"></i> Enviar pedido por WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQ-MoRMW33c-qQJXZzx-GFElaNa0qVZXGRWmtmQkrxAH-hdiclqqe2V_I0W8TSETFZVWcJKsrYDa-Ys/pub?gid=0&single=true&output=csv";
        const WHATSAPP_NUMBER = "584220699144"; 

        let products = [];
        let filteredProducts = [];
        let cart = JSON.parse(localStorage.getItem('passarela_cart')) || [];
        let currentCategory = 'ALL';
        let visibleLimit = 10;

        function fetchProducts() {
            Papa.parse(CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    products = results.data.map((item, index) => {
                        const getField = (keys) => {
                            const foundKey = Object.keys(item).find(k => keys.includes(k.trim().toLowerCase()));
                            return foundKey ? item[foundKey] : undefined;
                        };

                        const name = getField(['name', 'nombre', 'producto']) || 'Sin nombre';
                        const rawPrice = getField(['price', 'precio', 'costo']) || '0';
                        const price = parseFloat(rawPrice.toString().replace(/[^0-9.]/g, '')) || 0;
                        const image = getField(['image', 'imagen', 'foto']) || 'https://via.placeholder.com/400';
                        const category = getField(['category', 'categoria', 'categoría']) || 'General';
                        const size = getField(['size', 'talla', 'tallas']) || 'Única';

                        return {
                            id: 'p_' + index,
                            name: name.toString().trim(),
                            price: price,
                            image: image.toString().trim(),
                            category: category.toString().trim(),
                            size: size.toString().trim()
                        };
                    }).filter(p => p.name !== 'Sin nombre' && p.price > 0);

                    filteredProducts = products;
                    renderCategories();
                    renderProducts();
                    updateCartCount();
                },
                error: function(err) {
                    console.error("Error al leer CSV:", err);
                    document.getElementById('product-grid').innerHTML = `
                        <div class="col-span-full text-center py-12 text-rose-500 bg-rose-50 rounded-2xl p-6">
                            <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                            <p class="font-medium text-sm">No se pudieron cargar los productos. Verifica el enlace CSV.</p>
                        </div>
                    `;
                }
            });
        }

        function renderCategories() {
            const categories = ['ALL', ...new Set(products.map(p => p.category))];
            const container = document.getElementById('category-filters');
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="category-btn shrink-0 px-3 py-1.5 rounded-full text-[11px] font-semibold uppercase tracking-wider transition ${currentCategory === cat ? 'bg-slate-900 text-white shadow-xs' : 'bg-white/80 border border-rose-200 text-slate-700 hover:bg-white'}">
                    ${cat === 'ALL' ? 'Todos' : cat}
                </button>
            `).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            visibleLimit = 10; 
            
            filteredProducts = products.filter(p => {
                const matchesCat = category === 'ALL' || p.category === category;
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            renderCategories();
            renderProducts();
        }

        function handleSearch() {
            visibleLimit = 10; 
            filterCategory(currentCategory);
        }

        function loadMoreProducts() {
            visibleLimit += 10; 
            renderProducts();
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            const loadMoreContainer = document.getElementById('load-more-container');

            if (filteredProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-600 text-sm font-medium">No se encontraron productos.</div>`;
                loadMoreContainer.classList.add('hidden');
                return;
            }

            const productsToShow = filteredProducts.slice(0, visibleLimit);

            grid.innerHTML = productsToShow.map((p, index) => `
                <div class="bg-rose-100/90 rounded-2xl border border-rose-100/60 shadow-xs hover:shadow-md transition duration-300 overflow-hidden flex flex-col justify-between group">
                    <div onclick="openProductModal(${index})" class="h-40 sm:h-80 overflow-hidden bg-slate-100 relative cursor-pointer">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy" onerror="this.src='https://via.placeholder.com/400'">
                        <span class="absolute top-2 left-2 sm:top-3 sm:left-3 bg-white/90 backdrop-blur-sm text-slate-800 text-[9px] sm:text-[10px] font-bold px-2 py-0.5 sm:px-2.5 sm:py-1 rounded-full uppercase tracking-wider shadow-xs max-w-[85%] truncate">${p.category}</span>
                    </div>
                    <div class="p-2.5 sm:p-5 flex flex-col flex-1 justify-between">
                        <div onclick="openProductModal(${index})" class="cursor-pointer">
                            <h3 class="font-medium text-slate-900 text-xs sm:text-base mb-1 line-clamp-2 sm:line-clamp-1 leading-tight sm:leading-normal">${p.name}</h3>
                            <div class="flex items-center justify-between mb-2.5 sm:mb-4">
                                <p class="text-slate-900 font-bold text-sm sm:text-lg">$${p.price.toFixed(2)}</p>
                                <span class="text-[10px] sm:text-xs font-bold bg-white/80 text-slate-700 px-2 py-0.5 rounded-md border border-rose-200">Talla: ${p.size}</span>
                            </div>
                        </div>
                        <button onclick="addToCartFiltered(${index})" class="w-full bg-slate-900 text-white py-2 sm:py-2.5 rounded-xl text-[10px] sm:text-xs font-semibold tracking-wide uppercase hover:bg-slate-800 active:scale-[0.98] transition flex items-center justify-center gap-1.5">
                            <i class="fa-solid fa-cart-plus text-xs"></i> Agregar
                        </button>
                    </div>
                </div>
            `).join('');

            if (visibleLimit < filteredProducts.length) {
                loadMoreContainer.classList.remove('hidden');
            } else {
                loadMoreContainer.classList.add('hidden');
            }
        }

        /* Funciones del Modal */
        function openProductModal(index) {
            const product = filteredProducts[index];
            if (!product) return;

            document.getElementById('modal-img').src = product.image;
            document.getElementById('modal-category').innerText = product.category;
            document.getElementById('modal-name').innerText = product.name;
            document.getElementById('modal-price').innerText = `$${product.price.toFixed(2)}`;
            document.getElementById('modal-size').innerText = product.size;
            
            // Asignar acción al botón del modal
            document.getElementById('modal-add-btn').setAttribute('onclick', `addToCartFiltered(${index}); closeProductModal();`);

            document.getElementById('product-modal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('product-modal').classList.add('hidden');
        }

        function addToCartFiltered(index) {
            const product = filteredProducts[index];
            if (!product) return;

            const existing = cart.find(item => item.id === product.id);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            updateCartCount();

            const drawer = document.getElementById('cart-drawer');
            drawer.classList.remove('hidden');
            renderCartItems();
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
            if (!drawer.classList.contains('hidden')) {
                renderCartItems();
            }
        }

        function updateQuantity(id, change) {
            const item = cart.find(item => item.id === id);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== id);
                }
            }
            saveCart();
            updateCartCount();
            renderCartItems();
        }

        function saveCart() {
            localStorage.setItem('passarela_cart', JSON.stringify(cart));
        }

        function updateCartCount() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalItems;
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-16 text-sm">Tu carrito está vacío</div>`;
                document.getElementById('cart-total').innerText = '$0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                let subtotal = item.price * item.quantity;
                total += subtotal;
                return `
                    <div class="flex items-center justify-between pt-4 first:pt-0">
                        <div class="flex items-center gap-3">
                            <img src="${item.image}" class="w-12 h-12 sm:w-14 sm:h-14 object-cover rounded-xl border border-slate-100" onerror="this.src='https://via.placeholder.com/400'">
                            <div>
                                <h4 class="font-medium text-slate-900 text-xs sm:text-sm line-clamp-1">${item.name}</h4>
                                <p class="text-slate-500 text-[11px]">Talla: ${item.size} | $${item.price.toFixed(2)} c/u</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQuantity('${item.id}', -1)" class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 transition text-xs font-bold">-</button>
                            <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
                            <button onclick="updateQuantity('${item.id}', 1)" class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 transition text-xs font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return;

            let message = "Hola! 🛍️ Me gustaría realizar el siguiente pedido desde la web:\n\n";
            let total = 0;

            cart.forEach(item => {
                let subtotal = item.price * item.quantity;
                total += subtotal;
                message += `▪️ *${item.quantity}x* ${item.name} (Talla: ${item.size}) - $${subtotal.toFixed(2)}\n`;
            });

            message += `\n*Total a cancelar: $${total.toFixed(2)}*\n\nQuedo atento/a para coordinar los detalles de pago y envío. ¡Gracias!`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
