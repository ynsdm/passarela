<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passarela | Catálogo Exclusivo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para iconos -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="https://assets.softr-files.com/applications/c32952a6-aa43-469c-9079-0a9ec3504333/assets/c6d1c0f5-f972-44c0-b9aa-70b4fd965ee9.png">
</head>
<body class="bg-slate-50 text-slate-800 antialiased flex flex-col min-h-screen">

    <!-- Header / Navbar -->
    <header class="sticky top-0 z-40 bg-white/90 backdrop-blur-md border-b border-slate-100 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-20 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <h1 class="text-2xl font-black tracking-widest text-slate-900 uppercase">PASSARELA</h1>
            </div>
            
            <!-- Buscador de Escritorio y Carrito -->
            <div class="flex items-center gap-4">
                <button onclick="toggleCart()" class="relative bg-slate-900 text-white px-5 py-2.5 rounded-full flex items-center gap-2.5 hover:bg-slate-800 transition shadow-sm font-medium text-sm">
                    <i class="fa-solid fa-bag-shopping text-base"></i>
                    <span class="hidden sm:inline">Pedido</span>
                    <span id="cart-count" class="absolute -top-1.5 -right-1.5 bg-rose-600 text-[11px] text-white w-5 h-5 rounded-full flex items-center justify-center font-bold ring-2 ring-white">0</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Contenido Principal -->
    <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Hero Section / Bienvenida -->
        <div class="text-center max-w-2xl mx-auto mb-10">
            <h2 class="text-3xl sm:text-4xl font-light tracking-tight text-slate-900 mb-3">Catálogo en Línea</h2>
            <p class="text-slate-500 text-sm sm:text-base">Explora nuestra colección, arma tu carrito de compras y realiza tu pedido directamente por WhatsApp de forma rápida y sencilla.</p>
        </div>

        <!-- Filtros y Buscador -->
        <div class="flex flex-col md:flex-row justify-between items-center gap-4 mb-8">
            <!-- Categorías (Generadas Dinámicamente) -->
            <div id="category-filters" class="flex flex-wrap justify-center md:justify-start gap-2 w-full md:w-auto">
                <button onclick="filterCategory('ALL')" class="category-btn active px-4 py-2 rounded-full text-xs font-semibold uppercase tracking-wider bg-slate-900 text-white transition">Todos</button>
            </div>

            <!-- Buscador en tiempo real -->
            <div class="w-full md:w-72 relative">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-magnifying-glass text-xs"></i>
                </span>
                <input type="text" id="search-input" oninput="handleSearch()" placeholder="Buscar producto..." class="w-full pl-10 pr-4 py-2 bg-white border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-slate-900 transition">
            </div>
        </div>

        <!-- Grid de Productos -->
        <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <!-- Skeleton Loader inicial -->
            <div class="col-span-full flex flex-col items-center justify-center py-20 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-3xl mb-3 text-slate-900"></i>
                <p class="text-sm font-medium">Cargando productos desde Google Sheets...</p>
            </div>
        </div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-100 py-8 text-center text-xs text-slate-400 mt-12">
        <p>© 2026 Passarela. Todos los derechos reservados.</p>
    </footer>

    <!-- Panel Lateral del Carrito (Drawer) -->
    <div id="cart-drawer" class="fixed inset-0 z-50 overflow-hidden hidden">
        <div class="absolute inset-0 bg-slate-900/40 backdrop-blur-sm transition-opacity" onclick="toggleCart()"></div>
        <div class="absolute inset-y-0 right-0 max-w-full flex pl-10">
            <div class="w-screen max-w-md bg-white shadow-2xl flex flex-col transform transition-transform">
                
                <!-- Cabecera del Carrito -->
                <div class="flex items-center justify-between px-6 py-5 border-b border-slate-100">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-bag-shopping text-slate-900"></i>
                        <h3 class="font-bold text-slate-900 text-base">Tu Carrito</h3>
                    </div>
                    <button onclick="toggleCart()" class="w-8 h-8 rounded-full bg-slate-50 flex items-center justify-center text-slate-400 hover:text-slate-600 transition">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>
                
                <!-- Lista de items -->
                <div id="cart-items" class="flex-1 overflow-y-auto p-6 space-y-4 divide-y divide-slate-50">
                    <!-- Dinámico -->
                </div>

                <!-- Footer del Carrito & Checkout -->
                <div class="border-t border-slate-100 p-6 bg-slate-50/50">
                    <div class="flex justify-between items-center mb-4">
                        <span class="text-slate-500 text-sm">Subtotal estimado:</span>
                        <span id="cart-total" class="text-xl font-bold text-slate-900">$0.00</span>
                    </div>
                    <button onclick="checkoutWhatsApp()" class="w-full bg-emerald-600 text-white py-3.5 rounded-2xl font-semibold flex items-center justify-center gap-2.5 hover:bg-emerald-700 transition shadow-lg shadow-emerald-600/20 text-sm">
                        <i class="fa-brands fa-whatsapp text-xl"></i> Enviar pedido por WhatsApp
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Script de Lógica Principal -->
    <script>
        // ⚠️ PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
        const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbw8i6Kea2lqcNqFu7k4hwYjP7p4M08KSvxaa3sod1k8VI2w6CRrTTv70awE7UKo70FRlw/exec";
        
        const WHATSAPP_NUMBER = "584220699144"; 

        let products = [];
        let filteredProducts = [];
        let cart = JSON.parse(localStorage.getItem('passarela_cart')) || [];
        let currentCategory = 'ALL';

        // Cargar productos al iniciar
        async function fetchProducts() {
            try {
                const response = await fetch(APPS_SCRIPT_URL);
                const data = await response.json();
                products = data.map((item, index) => ({
                    ID: item.id || index + 1,
                    NAME: item.name || 'Sin nombre',
                    PRICE: parseFloat(item.price) || 0,
                    IMAGE: item.image || 'https://via.placeholder.com/400',
                    CATEGORY: item.category || 'General'
                    TALLA: item.talla || 'Sin Talla'
                }));
                filteredProducts = products;
                renderCategories();
                renderProducts();
            } catch (error) {
                console.error("Error al cargar Google Sheets:", error);
                document.getElementById('product-grid').innerHTML = `
                    <div class="col-span-full text-center py-12 text-rose-500 bg-rose-50 rounded-2xl p-6">
                        <i class="fa-solid fa-triangle-exclamation text-2xl mb-2"></i>
                        <p class="font-medium text-sm">No se pudieron cargar los productos. Verifica la URL de Apps Script.</p>
                    </div>
                `;
            }
        }

        function renderCategories() {
            const categories = ['ALL', ...new Set(products.map(p => p.category))];
            const container = document.getElementById('category-filters');
            
            container.innerHTML = categories.map(cat => `
                <button onclick="filterCategory('${cat}')" class="category-btn px-4 py-2 rounded-full text-xs font-semibold uppercase tracking-wider transition ${currentCategory === cat ? 'bg-slate-900 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'}">
                    ${cat === 'ALL' ? 'Todos' : cat}
                </button>
            `).join('');
        }

        function filterCategory(category) {
            currentCategory = category;
            const searchVal = document.getElementById('search-input').value.toLowerCase();
            
            filteredProducts = products.filter(p => {
                const matchesCat = category === 'ALL' || p.category === category;
                const matchesSearch = p.name.toLowerCase().includes(searchVal);
                return matchesCat && matchesSearch;
            });

            renderCategories();
            renderProducts();
        }

        function handleSearch() {
            filterCategory(currentCategory);
        }

        function renderProducts() {
            const grid = document.getElementById('product-grid');
            if (filteredProducts.length === 0) {
                grid.innerHTML = `<div class="col-span-full text-center py-16 text-slate-400 text-sm">No se encontraron productos.</div>`;
                return;
            }

            grid.innerHTML = filteredProducts.map(p => `
                <div class="bg-white rounded-2xl border border-slate-100 shadow-sm hover:shadow-md transition duration-300 overflow-hidden flex flex-col justify-between group">
                    <div class="h-64 overflow-hidden bg-slate-100 relative">
                        <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" loading="lazy">
                        <span class="absolute top-3 left-3 bg-white/90 backdrop-blur-sm text-slate-800 text-[10px] font-bold px-2.5 py-1 rounded-full uppercase tracking-wider shadow-xs">${p.category}</span>
                    </div>
                    <div class="p-5 flex flex-col flex-1 justify-between">
                        <div>
                            <h3 class="font-medium text-slate-900 text-sm sm:text-base mb-1 line-clamp-1">${p.name}</h3>
                            <p class="text-slate-900 font-bold text-lg mb-4">$${p.price.toFixed(2)}</p>
                        </div>
                        <button onclick="addToCart(${p.id})" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-semibold tracking-wide uppercase hover:bg-slate-800 active:scale-[0.98] transition flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-plus text-sm"></i> Agregar
                        </button>
                    </div>
                </div>
            `).join('');
        }

        function toggleCart() {
            const drawer = document.getElementById('cart-drawer');
            drawer.classList.toggle('hidden');
            renderCartItems();
        }

        function addToCart(productId) {
            const product = products.find(p => p.id === productId);
            const existing = cart.find(item => item.id === productId);

            if (existing) {
                existing.quantity += 1;
            } else {
                cart.push({ ...product, quantity: 1 });
            }

            saveCart();
            updateCartCount();
            
            // Efecto visual rápido al abrir o agregar
            toggleCart();
        }

        function updateQuantity(productId, change) {
            const item = cart.find(item => item.id === productId);
            if (item) {
                item.quantity += change;
                if (item.quantity <= 0) {
                    cart = cart.filter(i => i.id !== productId);
                }
            }
            saveCart();
            updateCartCount();
            renderCartItems();
        }

        function saveCart() {
            localStorage.setItem('passarela_cart', JSON.stringify(cart));
        }

        function updateCartCount() {
            const totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);
            document.getElementById('cart-count').innerText = totalItems;
        }

        function renderCartItems() {
            const container = document.getElementById('cart-items');
            if (cart.length === 0) {
                container.innerHTML = `<div class="text-center text-slate-400 py-16 text-sm">Tu carrito está vacío</div>`;
                document.getElementById('cart-total').innerText = '$0.00';
                return;
            }

            let total = 0;
            container.innerHTML = cart.map(item => {
                let subtotal = item.price * item.quantity;
                total += subtotal;
                return `
                    <div class="flex items-center justify-between pt-4 first:pt-0">
                        <div class="flex items-center gap-3">
                            <img src="${item.image}" class="w-14 h-14 object-cover rounded-xl border border-slate-100">
                            <div>
                                <h4 class="font-medium text-slate-900 text-xs sm:text-sm line-clamp-1">${item.name}</h4>
                                <p class="text-slate-500 text-xs mt-0.5">$${item.price.toFixed(2)} c/u</p>
                            </div>
                        </div>
                        <div class="flex items-center gap-2">
                            <button onclick="updateQuantity(${item.id}, -1)" class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 transition text-xs font-bold">-</button>
                            <span class="text-xs font-bold w-4 text-center">${item.quantity}</span>
                            <button onclick="updateQuantity(${item.id}, 1)" class="w-6 h-6 bg-slate-100 rounded-full flex items-center justify-center text-slate-600 hover:bg-slate-200 transition text-xs font-bold">+</button>
                        </div>
                    </div>
                `;
            }).join('');

            document.getElementById('cart-total').innerText = `$${total.toFixed(2)}`;
        }

        function checkoutWhatsApp() {
            if (cart.length === 0) return;

            let message = "Hola! 🛍️ Me gustaría realizar el siguiente pedido desde la web:\n\n";
            let total = 0;

            cart.forEach(item => {
                let subtotal = item.price * item.quantity;
                total += subtotal;
                message += `▪️ *${item.quantity}x* ${item.name} - $${subtotal.toFixed(2)}\n`;
            });

            message += `\n*Total a cancelar: $${total.toFixed(2)}*\n\nQuedo atento/a para coordinar los detalles de pago y envío. ¡Gracias!`;

            const encodedMessage = encodeURIComponent(message);
            window.open(`https://wa.me/${WHATSAPP_NUMBER}?text=${encodedMessage}`, '_blank');
        }

        // Inicializar
        document.addEventListener('DOMContentLoaded', fetchProducts);
    </script>
</body>
</html>
